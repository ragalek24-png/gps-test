// Универсальные подсказки
const universalHints = [
  'Я могу попробовать по-другому, даже если пока не уверен(а)',
  'Я имею право на ошибку и на новый опыт',
  'Я могу быть мягче к себе в этой ситуации',

];

// Анализ текста: ищем не просто слова, а сочетания и приоритеты
function analyzeText(text) {
  const lower = text.toLowerCase();
  const matches = [];

  for (const group of beliefGroups) {
    let matched = false;
    // В группе keys — массив массивов. Достаточно, чтобы совпал хотя бы один массив целиком
    // (все слова из него есть в тексте).
    for (const combination of group.keys) {
      if (combination.every(word => lower.includes(word))) {
        matched = true;
        break;
      }
    }
    if (matched) {
      matches.push(group);
    }
  }

  // Сортируем по приоритету: сначала самые важные
  matches.sort((a, b) => b.priority - a.priority);

  return matches;
}

function getHints(text) {
  const matches = analyzeText(text);
  if (matches.length === 0) return universalHints;

  // Берём только самую важную группу (с самым высоким приоритетом)
  const topGroup = matches[0];
  return topGroup.hints;
}

function showHints() {
  const oldText = document.getElementById('s5-old').value || document.getElementById('s2-core').value;
  const container = document.getElementById('hints-container');
  const list = document.getElementById('hints-list');
  
  const hints = getHints(oldText);
  
  container.classList.remove('hidden');
  list.innerHTML = hints.map(h => `<div class="hint-box p-3 rounded-lg text-sm text-slate-300 cursor-pointer hover:bg-slate-800 transition" onclick="useHint(this)">«${h}»</div>`).join('');
}

function useHint(el) {
  const text = el.textContent.replace(/[«»]/g, '');
  document.getElementById('s5-new').value = text;
  saveAll();
}
