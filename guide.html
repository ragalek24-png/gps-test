// Универсальные подсказки
const universalHints = [
  'Я могу попробовать по-другому, даже если пока не уверен(а)',
  'Я имею право на ошибку и на новый опыт',
  'Я могу быть мягче к себе в этой ситуации',
  'Я могу начать с малого шага',
  'Я не обязан(а) быть идеальным(ой), чтобы двигаться вперёд'
];

function getHints(text) {
  const lower = text.toLowerCase();
  const matched = [];
  for (const group of beliefHints) {
    if (group.keys.some(k => lower.includes(k))) {
      matched.push(...group.hints);
    }
  }
  if (matched.length === 0) {
    return universalHints;
  }
  return [...new Set(matched)];
}

function showHints() {
  const oldText = document.getElementById('s5-old').value || document.getElementById('s2-core').value;
  const container = document.getElementById('hints-container');
  const list = document.getElementById('hints-list');
  
  const hints = getHints(oldText);
  
  container.classList.remove('hidden');
  list.innerHTML = hints.map(h => `<div class="hint-box p-3 rounded-lg text-sm text-slate-300 cursor-pointer hover:bg-slate-800 transition" onclick="useHint(this)">«${h}»</div>`).join('');
}

function useHint(el) {
  const text = el.textContent.replace(/[«»]/g, '');
  document.getElementById('s5-new').value = text;
  saveAll();
}

function goTo(n) {
  document.querySelectorAll('.scene').forEach(el => el.classList.add('hidden'));
  document.getElementById('scene-' + n).classList.remove('hidden');
  currentScene = n;
  saveAll();
  if (n === 6) showSummary();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function saveAll() {
  const data = { currentScene };
  document.querySelectorAll('textarea, input').forEach(el => {
    if (el.id) data[el.id] = el.value;
  });
  localStorage.setItem('compass_data', JSON.stringify(data));
}

function loadAll() {
  const saved = localStorage.getItem('compass_data');
  if (!saved) return;
  try {
    const data = JSON.parse(saved);
    Object.keys(data).forEach(id => {
      if (id === 'currentScene') {
        currentScene = data[id];
      } else {
        const el = document.getElementById(id);
        if (el) el.value = data[id];
      }
    });
    if (currentScene > 0) goTo(currentScene);
  } catch(e) {}
}

function showSummary() {
  const content = document.getElementById('summary-content');

  const voice = document.getElementById('s1-voice').value;
  const rule = document.getElementById('s2-rule').value;
  const core = document.getElementById('s2-core').value;
  const oldB = document.getElementById('s5-old').value;
  const newB = document.getElementById('s5-new').value;
  const feeling = document.getElementById('s5-feeling').value;

  content.innerHTML = `
    <div>
      <p class="text-sm text-slate-500 mb-1">Ситуация</p>
      <p>${situation || '—'}</p>
    </div>
    <div>

    </div>
    <div>

    </div>

      <p>${core || '—'}</p>
    </div>
    <div class="border-t border-slate-700 pt-4">
      <p class="text-sm text-slate-500 mb-1">Старая мысль</p>
      <p>${oldB || '—'}</p>
    </div>
    <div>
      <p class="text-sm text-slate-500 mb-1">Новая мысль</p>
      <p class="text-emerald-400 font-semibold">${newB || '—'}</p>
    </div>
    <div>
      <p class="text-sm text-slate-500 mb-1">Что вы чувствуете</p>
      <p>${feeling || '—'}</p>
    </div>
  `;
}

function resetAll() {
  if (!confirm('Начать заново? Все записи будут удалены.')) return;
  localStorage.removeItem('compass_data');
  location.reload();
}

document.querySelectorAll('textarea, input').forEach(el => {
  el.addEventListener('input', saveAll);
});

loadAll();
