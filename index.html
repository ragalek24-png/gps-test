function calc(){let s=0;if(a.q1!==null)s+=a.q1;if(a.q2!==null)s+=a.q2;if(a.q3!==null)s+=a.q3;if(a.q6!==null)s+=a.q6;return s<=3?'balanced':s<=6?'mild':s<=9?'moderate':'intense';}

// --- РАСШИРЕННЫЙ АНАЛИЗ УСТАНОВОК (8 штук) ---
function analyzeBeliefs(q4, q5) {
  const all = [...q4, ...q5].filter(t => t && t.trim() !== '');
  const beliefs = [];
  
  const duty = all.filter(t => /(должен|должна|надо|обязан|обязана)/i.test(t));
  if (duty.length) beliefs.push({ title: 'Установка «Я должен»', count: duty.length, desc: 'Жизнь по правилам, которые человек сам себе установил. Свобода = эгоизм.', examples: duty.slice(0, 2) });

  const fear = all.filter(t => /(страх|боюсь|тревог|опасн|неуверен)/i.test(t));
  if (fear.length) beliefs.push({ title: 'Установка «Мир опасен»', count: fear.length, desc: 'Ожидание угрозы. Даже нейтральные ситуации воспринимаются как риск.', examples: fear.slice(0, 2) });

  const perfection = all.filter(t => /(идеальн|безошиб|всегда|продуктивн|лучше всех)/i.test(t));
  if (perfection.length) beliefs.push({ title: 'Установка «Быть идеальным»', count: perfection.length, desc: 'Ценность зависит от безошибочности и продуктивности.', examples: perfection.slice(0, 2) });

  const shame = all.filter(t => /(стыд|позор|вина|унижен|провал)/i.test(t));
  if (shame.length) beliefs.push({ title: 'Установка «Ошибка = Позор»', count: shame.length, desc: 'Публичная ошибка = потеря лица.', examples: shame.slice(0, 2) });

  const control = all.filter(t => /(контрол|порядок|план|распоряд)/i.test(t));
  if (control.length) beliefs.push({ title: 'Установка «Всё под контролем»', count: control.length, desc: 'Потребность контролировать всё, чтобы чувствовать себя в безопасности.', examples: control.slice(0, 2) });

  const deval = all.filter(t => /(ничего не получаю|не получаю|все равно|недостаточно|плохо|зря)/i.test(t));
  if (deval.length) beliefs.push({ title: 'Установка «Я недостаточно хорош»', count: deval.length, desc: 'Обесценивание своих достижений, ощущение неполноценности.', examples: deval.slice(0, 2) });

  const approval = all.filter(t => /(подумают|мнение|считают|осужд|понрав|оцен)/i.test(t));
  if (approval.length) beliefs.push({ title: 'Установка «Нужно одобрение»', count: approval.length, desc: 'Зависимость от чужого мнения. Страх не понравиться.', examples: approval.slice(0, 2) });

  const hyper = all.filter(t => /(ответственн|отвечать|за все|за других)/i.test(t));
  if (hyper.length) beliefs.push({ title: 'Установка «Гиперответственность»', count: hyper.length, desc: 'Чувство, что вы отвечаете за всё и всех вокруг.', examples: hyper.slice(0, 2) });

  return beliefs;
}

// --- АНАЛИЗ ЗАЩИТ (Q4, Q5) ---
function analyzeDefenses(q4, q5) {
  const all=[...q4,...q5].filter(t=>t&&t.trim()!=='');
  const defs=[];
  const mr=all.filter(t=>/(подумают|мнение|считают|осужд)/i.test(t)); if(mr.length)defs.push({title:'Чтение мыслей',count:mr.length,desc:'Чувствительность к чужому мнению.',examples:mr.slice(0,2)});
  const dv=all.filter(t=>/(ничего не получаю|все равно|недостаточно|плохо|зря)/i.test(t)); if(dv.length)defs.push({title:'Обесценивание',count:dv.length,desc:'Недостаточно хорош.',examples:dv.slice(0,2)});
  const hr=all.filter(t=>/(ответственн|отвечать|за все|должен|надо)/i.test(t)); if(hr.length)defs.push({title:'Гиперответственность',count:hr.length,desc:'Отвечаю за всё.',examples:hr.slice(0,2)});
  const ct=all.filter(t=>/(катастроф|ужас|кошмар|пропало|конец)/i.test(t)); if(ct.length)defs.push({title:'Катастрофизация',count:ct.length,desc:'Всё пропало.',examples:ct.slice(0,2)});
  return defs;
}

function analyzeText(answers) {
  const cats = {work:['работ','деньг','заработ','карьер'],anx:['тревог','пережив','страх','боюсь'],ctrl:['контрол','порядок','план','должн'],ppl:['люд','общ','друз','семь'],tired:['устал','сил','выгор','измат'],crit:['самокрит','вина','стыд','ошибк']};
  const counts={}; Object.keys(cats).forEach(k=>counts[k]=0);
  answers.forEach(t=>{const l=t.toLowerCase();Object.entries(cats).forEach(([k,w])=>{if(w.some(x=>l.includes(x)))counts[k]++;});});
  const names={work:'💼 Работа',anx:'🌪 Тревога',ctrl:'⚙️ Контроль',ppl:'🤝 Люди',tired:'🔋 Усталость',crit:'🪞 Самокритика'};
  return Object.entries(counts).filter(([_,c])=>c>0).sort((a,b)=>b[1]-a[1]).map(([k,c])=>({name:names[k],count:c,percent:Math.round(c/answers.length*100)}));
}

function drawChart(pc) {
  const ctx=document.getElementById('profileChart'); if(!ctx)return; if(chartInstance)chartInstance.destroy();
  chartInstance=new Chart(ctx,{type:'doughnut',data:{labels:Object.values(P).map(p=>p.l),datasets:[{data:Object.values(pc),backgroundColor:Object.values(P).map(p=>p.c),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
}

function exportToWord() {
  if(subs.length===0)return alert("Нет данных.");
  const pc={balanced:0,mild:0,moderate:0,intense:0}; subs.forEach(s=>{pc[s.profile]=(pc[s.profile]||0)+1;});
  const total=subs.length;
  const q4=subs.map(s=>s.q4).filter(t=>t&&t.trim()!==''), q5=subs.map(s=>s.q5).filter(t=>t&&t.trim()!=='');
  const themes=analyzeText([...q4,...q5]), defs=analyzeDefenses(q4,q5), beliefs=analyzeBeliefs(q4,q5);
  let html=`<html><head><meta charset="utf-8"><style>body{font-family:serif;font-size:12pt}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px}</style></head><body><h1>Анализ</h1><p>Дата: ${new Date().toLocaleString('ru-RU')} | Ответов: ${total}</p>`;
  html+=`<h2>Профили</h2><ul>${Object.entries(P).map(([k,v])=>`<li>${v.l}: ${pc[k]} (${Math.round(pc[k]/total*100)}%)</li>`).join('')}</ul>`;
  html+=`<h2>Установки</h2>${beliefs.length?beliefs.map(d=>`<div><b>${d.title}</b> (${d.count}): ${d.desc}<br><i>${d.examples.map(e=>`«${e}»`).join(', ')}</i></div>`).join(''):'Нет'}`;
  html+=`<h2>Защиты</h2>${defs.length?defs.map(d=>`<div><b>${d.title}</b> (${d.count}): ${d.desc}<br><i>${d.examples.map(e=>`«${e}»`).join(', ')}</i></div>`).join(''):'Нет'}`;
  html+=`<h2>Темы</h2><ul>${themes.map(t=>`<li>${t.name}: ${t.count} (${t.percent}%)</li>`).join('')}</ul>`;
  html+=`<h2>Ответы</h2><table><tr><th>#</th><th>Дата</th><th>Профиль</th><th>Q4</th><th>Q5</th></tr>${subs.map((s,i)=>`<tr><td>${total-i}</td><td>${new Date(s.created_at).toLocaleString('ru-RU')}</td><td>${P[s.profile]?.l}</td><td>${s.q4||'-'}</td><td>${s.q5||'-'}</td></tr>`).join('')}</table></body></html>`;
  const blob=new Blob(['\ufeff',html],{type:'application/msword'}), url=URL.createObjectURL(blob), link=document.createElement('a');
  link.href=url; link.download='Анализ_'+new Date().toISOString().slice(0,10)+'.doc'; document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
}

function render() {
  const app=document.getElementById('app');
  if(location.hash==='#admin') {
    if(!window.isAdmin){const pass=prompt("Пароль:"); if(pass==='admin2024'){window.isAdmin=true;load();}else{alert("Неверный пароль");location.hash='';return;}}
    const pc={balanced:0,mild:0,moderate:0,intense:0}; subs.forEach(s=>{pc[s.profile]=(pc[s.profile]||0)+1;});
    const t=subs.length;
    let overHTML='';
    if(view==='overview'&&t>0){
      const q4=subs.map(s=>s.q4).filter(x=>x&&x.trim()!==''), q5=subs.map(s=>s.q5).filter(x=>x&&x.trim()!=='');
      const themes=analyzeText([...q4,...q5]), defs=analyzeDefenses(q4,q5), beliefs=analyzeBeliefs(q4,q5);
      overHTML=`
      <div class="grid md:grid-cols-2 gap-4 mb-4">
        <div class="bg-white p-6 rounded-xl shadow-sm"><h3 class="font-semibold mb-4">Профили</h3><div class="h-64 relative"><canvas id="profileChart"></canvas></div></div>
        <div class="bg-white p-6 rounded-xl shadow-sm"><h3 class="font-semibold mb-4">Статистика</h3>${Object.entries(P).map(([k,v])=>{const c=pc[k]||0,p=t>0?c/t*100:0;return`<div class="flex items-center gap-3 mb-2"><span class="w-28 text-sm">${v.l}</span><div class="flex-1 h-5 bg-gray-100 rounded"><div class="h-full rounded text-white text-xs flex items-center justify-end pr-1" style="width:${Math.max(p,2)}%;background-color:${v.c}">${c}</div></div><span class="text-xs w-10 text-right">${p.toFixed(0)}%</span></div>`}).join('')}</div>
      </div>
      
      <!-- УСТАНОВКИ СВЕРХУ -->
      <div class="bg-indigo-50 p-6 rounded-xl shadow-sm mb-4 border-l-4 border-indigo-500"><h3 class="font-semibold mb-3 text-indigo-900">🧠 Установки</h3>${beliefs.length?`<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${beliefs.map(d=>`<div class="bg-white p-4 rounded-lg border border-indigo-100"><div class="flex justify-between mb-2"><b class="text-indigo-800 text-sm">${d.title}</b><span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-1 rounded-full">${d.count}</span></div><p class="text-xs mb-2 text-gray-600">${d.desc}</p><ul class="text-xs list-disc pl-4 text-gray-500">${d.examples.map(e=>`<li>«${e}»</li>`).join('')}</ul></div>`).join('')}</div>`:'<p class="text-sm text-gray-500">Нет данных</p>'}</div>

      <!-- ЗАЩИТЫ НИЖЕ -->
      <div class="bg-rose-50 p-6 rounded-xl shadow-sm mb-4 border-l-4 border-rose-500"><h3 class="font-semibold mb-3 text-rose-900">🛡 Защиты</h3>${defs.length?`<div class="grid md:grid-cols-2 gap-4">${defs.map(d=>`<div class="bg-white p-4 rounded-lg border border-rose-100"><div class="flex justify-between mb-2"><b class="text-rose-800 text-sm">${d.title}</b><span class="bg-rose-100 text-rose-700 text-xs px-2 py-1 rounded-full">${d.count}</span></div><p class="text-xs mb-2 text-gray-600">${d.desc}</p><ul class="text-xs list-disc pl-4 text-gray-500">${d.examples.map(e=>`<li>«${e}»</li>`).join('')}</ul></div>`).join('')}</div>`:'<p class="text-sm text-gray-500">Нет данных</p>'}</div>

      <div class="grid md:grid-cols-2 gap-4 mb-4">
        <div class="bg-white p-6 rounded-xl shadow-sm"><h3 class="font-semibold mb-2">Q4</h3><ul class="space-y-2 max-h-60 overflow-y-auto pr-2">${q4.map(x=>`<li class="bg-violet-50 p-2 rounded text-sm border-l-4 border-violet-300">${x}</li>`).join('')}</ul></div>
        <div class="bg-white p-6 rounded-xl shadow-sm"><h3 class="font-semibold mb-2">Q5</h3><ul class="space-y-2 max-h-60 overflow-y-auto pr-2">${q5.map(x=>`<li class="bg-violet-50 p-2 rounded text-sm border-l-4 border-violet-300">${x}</li>`).join('')}</ul></div>
      </div>`;
      setTimeout(()=>drawChart(pc),50);
    }
    let listHTML='';
    if(view==='list'){
      listHTML=`<div class="bg-white p-6 rounded-xl shadow-sm"><h3 class="font-semibold mb-4">Все ответы (${t})</h3><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="border-b"><th>#</th><th>Дата</th><th>Профиль</th><th>Q4</th><th>Q5</th></tr></thead><tbody>${subs.map((s,i)=>`<tr class="border-b"><td class="p-2">${t-i}</td><td class="p-2 whitespace-nowrap">${new Date(s.created_at).toLocaleString('ru-RU')}</td><td class="p-2"><span class="px-2 py-1 rounded text-xs text-white" style="background:${P[s.profile]?.c}">${P[s.profile]?.l}</span></td><td class="p-2">${s.q4||'-'}</td><td class="p-2">${s.q5||'-'}</td></tr>`).join('')}</tbody></table></div></div>`;
    }
    app.innerHTML=`<div class="min-h-screen bg-gray-50 p-4"><div class="max-w-6xl mx-auto">
      <div class="bg-white p-6 rounded-xl shadow-sm mb-6">
        <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Админ</h1><button onclick="exportToWord()" class="px-3 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700">📄 Word</button></div>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6"><div class="bg-gray-50 p-4 rounded-xl border"><div class="text-2xl font-bold">${t}</div><div class="text-xs text-gray-500">Всего</div></div>${Object.entries(P).map(([k,v])=>`<div class="bg-gray-50 p-4 rounded-xl border"><div class="text-2xl font-bold" style="color:${v.c}">${pc[k]}</div><div class="text-xs">${v.l}</div></div>`).join('')}</div>
        <button onclick="load()" id="refresh-btn" class="px-4 py-2 bg-violet-600 text-white rounded-lg text-sm hover:bg-violet-700"><span id="refresh-text">🔄 Обновить</span></button>
      </div>
      ${view==='overview'?overHTML:listHTML}
      <div class="flex gap-2"><button onclick="view='overview';render()" class="px-4 py-2 rounded-lg text-sm ${view==='overview'?'bg-violet-600 text-white':'bg-white border text-gray-700'}">Обзор</button><button onclick="view='list';render()" class="px-4 py-2 rounded-lg text-sm ${view==='list'?'bg-violet-600 text-white':'bg-white border text-gray-700'}">Список</button></div>
    </div></div>`;
    return;
  }

  if(step==='results'){const info=P[prof];app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center">${saved?'<div class="text-green-600 mb-4 font-medium">✓ Сохранено</div>':''}<h2 class="text-3xl font-bold mb-2">${info.l}</h2><p class="text-violet-600 mb-6">${info.d}</p><div class="bg-gray-50 p-4 rounded-xl mb-4 text-left text-sm"><b>Что это:</b> ${info.desc}</div><div class="bg-violet-50 p-4 rounded-xl mb-6 text-left text-sm"><b>💡 Совет:</b> ${info.tip}</div><button onclick="a={q1:null,q2:null,q3:null,q4:'',q5:'',q6:null};saved=false;step='intro';render()" class="text-violet-600 font-medium">Заново ↺</button></div></div>`;return;}

  const qHTML=q.o?`<div class="space-y-2">${q.o.map((opt,i)=>`<label class="block p-3 rounded-xl border-2 cursor-pointer ${a[step]===i?'border-violet-500 bg-violet-50':'border-gray-200'}"><input type="radio" ${a[step]===i?'checked':''} onchange="a['${step}']=${i};render()" class="hidden"/><span class="text-sm">${opt}</span></label>`).join('')}</div>`:`<textarea oninput="a['${step}']=this.value; checkNextBtn()" placeholder="..." class="w-full p-3 border-2 rounded-xl h-28 text-sm">${a[step]}</textarea>`;

function checkNextBtn(){const t=document.querySelector('textarea'),b=document.getElementById('next-btn');if(t&&b){const has=t.value.trim().length>0;b.disabled=!has;b.className=has?'px-5 py-2 rounded-xl font-semibold text-sm bg-violet-600 text-white':'px-5 py-2 rounded-xl font-semibold text-sm bg-gray-200 text-gray-400';}}

async function submit(){const b=document.getElementById('next-btn');if(b){b.disabled=true;b.innerText='⌛...';b.className='px-5 py-2 rounded-xl font-semibold text-sm bg-gray-400 text-white';}prof=calc();try{await supabase.from('submissions').insert({q1:a.q1,q2:a.q2,q3:a.q3,q4:a.q4,q5:a.q5,q6:a.q6,profile:prof});saved=true;}catch(e){alert('Ошибка сохранения');}step='results';render();}

async function load(){const el=document.getElementById('refresh-text');if(el)el.innerText='⌛...';try{const{data,error}=await supabase.from('submissions').select('*').order('created_at',{ascending:false});if(error)throw error;const uniq=[],seen=new Set();(data||[]).forEach(s=>{const k=`${s.q1}_${s.q2}_${s.q3}_${s.q4}_${s.q5}_${s.q6}_${new Date(s.created_at).toISOString().slice(0,19)}`;if(!seen.has(k)){seen.add(k);uniq.push(s);}});subs=uniq;}catch(e){alert('Ошибка загрузки');}finally{if(el)el.innerText='🔄 Обновить';render();}}

window.addEventListener('hashchange',render);
render();
</script>
