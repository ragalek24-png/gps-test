<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: Ваш внутренний GPS</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-violet-50 min-h-screen">
<div id="app"></div>
<script>
const Q = {
  q1: {s:'Секция 1',t:'Вы написали важное сообщение другу. Он прочитал, но не отвечает полдня. Первая мысль:',o:['Наверное, закрутился','Я написал что-то не то','Людям плевать на меня','Это катастрофа']},
  q2: {s:'Секция 1',t:'Вы случайно отправили не тот файл в чат. Исправили, но внутри:',o:['Бывает, поехали дальше','Какой я нелепый','Все думают что я непрофессионал','Нужно проверять всё десять раз']},
  q3: {s:'Секция 2',t:'Ваш внутренний голос после тяжёлого дня чаще всего говорит:',o:['Давай отдохнём, ты молодец','Мог бы и лучше, соберись','Почему ты всё усложняешь?','Завтра будет ещё хуже']},
  q4: {s:'Секция 3',t:'Закончите фразу:',p:'«Я бы чувствовал(а) себя свободно, если бы не нужно было постоянно...»'},
  q5: {s:'Секция 3',t:'Закончите фразу:',p:'«Моя суперсила — это [...], но она же меня и изматывает, потому что...»'},
  q6: {s:'Секция 4',t:'Вам предлагают сложную задачу с риском облажаться. Ваш отклик:',o:['Интересно, попробую','А вдруг я самозванец?','Если не идеально — нет смысла','Лучше откажусь, нет сил']}
};
const P={balanced:{e:'🧭',l:'Устойчивый',d:'GPS на здоровой волне',tip:'Гибкость — суперсила',c:'#10b981'},mild:{e:'🔍',l:'Наблюдатель',d:'GPS делает крюки',tip:'Адвокат дьявола: доказательства ПРОТИВ мысли?',c:'#6366f1'},moderate:{e:'⚡',l:'Радар',d:'Мозг усиливает сигналы',tip:'Дневник мыслей',c:'#f59e0b'},intense:{e:'🌊',l:'Исследователь',d:'Мир насыщен',tip:'Психолог (КПТ) даст инструменты',c:'#a855f7'}};
let step='intro',a={q1:null,q2:null,q3:null,q4:'',q5:'',q6:null},prof='',saved=false,subs=[],view='overview';
const steps=['q1','q2','q3','q4','q5','q6'];
function calc(){let s=0;if(a.q1!==null)s+=a.q1;if(a.q2!==null)s+=a.q2;if(a.q3!==null)s+=a.q3;if(a.q6!==null)s+=a.q6;return s<=3?'balanced':s<=6?'mild':s<=9?'moderate':'intense';}
function render(){
  const app=document.getElementById('app');
  if(location.hash==='#admin'){
    app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="text-center"><h1 class="text-2xl font-bold mb-4">Админка</h1><p class="text-gray-500">В этой версии база данных отключена, поэтому админка не работает.</p><a href="#" class="text-violet-600 mt-4 inline-block">← Вернуться к тесту</a></div></div>`;
    return;
  }
  if(step==='intro'){app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="text-center"><div class="text-6xl mb-6">🧭</div><h1 class="text-3xl font-bold mb-4">Ваш внутренний GPS<br/>в стрессовых ситуациях</h1><p class="text-lg text-gray-600 mb-6 max-w-lg">Пара быстрых вопросов о том, как ваш мозг реагирует на мелочи. 1 минута, анонимно.</p><button onclick="step='q1';render()" class="px-8 py-4 bg-violet-600 text-white rounded-xl text-lg">Начать тест →</button></div></div>`;return;}
  if(step==='results'){const info=P[prof];app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-xl shadow-xl p-8 max-w-lg">${saved?'<div class="text-green-600 mb-4">✓ Ответы сохранены (локально)</div>':''}<div class="text-center mb-6"><h2 class="text-3xl font-bold mb-4">${info.e} ${info.l}</h2><p>${info.d}</p></div><div class="bg-violet-50 rounded-xl p-4 mb-4"><h3 class="font-semibold mb-2">💡 ${info.tip}</h3></div><button onclick="a={q1:null,q2:null,q3:null,q4:'',q5:'',q6:null};saved=false;step='intro';render()" class="text-violet-600">Заново ↺</button></div></div>`;return;}
  const q=Q[step];const ci=steps.indexOf(step);const prog=(ci+1)/steps.length*100;
  const qHTML=q.o?`<div class="space-y-3">${q.o.map((opt,i)=>`<label class="block p-4 rounded-xl border-2 cursor-pointer ${a[step]===i?'border-violet-500 bg-violet-50':'border-gray-200'}"><input type="radio" ${a[step]===i?'checked':''} onchange="a['${step}']=${i};render()" class="hidden"/><span>${opt}</span></label>`).join('')}</div>`:`<textarea oninput="a['${step}']=this.value" placeholder="Напишите..." class="w-full p-4 border-2 rounded-xl h-32">${a[step]}</textarea>`;
  const can=q.o?a[step]!==null:a[step].trim().length>0;
  app.innerHTML=`<div class="min-h-screen p-4"><div class="max-w-2xl mx-auto py-8"><div class="mb-6"><div class="flex justify-between text-sm mb-2"><span>Вопрос ${ci+1} из 6</span><span>${Math.round(prog)}%</span></div><div class="h-2 bg-gray-200 rounded-full"><div class="h-full bg-violet-500 rounded-full" style="width:${prog}%"></div></div></div><div class="bg-white rounded-xl shadow-xl p-6"><div class="text-xs text-violet-500 uppercase mb-2">${q.s}</div><h2 class="text-xl font-semibold mb-6">${q.t}</h2>${q.p?`<p class="text-gray-500 text-sm mb-4">${q.p}</p>`:''}${qHTML}</div><div class="flex justify-between mt-6">${ci>0?`<button onclick="step=steps[${ci-1}];render()" class="px-5 py-2 text-gray-500">← Назад</button>`:'<div></div>'}<button onclick="${ci<5?`step=steps[${ci+1}];render()`:'submit()'}" ${!can?'disabled':''} class="px-6 py-2 rounded-xl font-semibold ${can?'bg-violet-600 text-white':'bg-gray-200 text-gray-400'}">${ci<5?'Далее →':'Результат ✨'}</button></div></div></div>`;
}
async function submit(){prof=calc();saved=true;step='results';render();}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
