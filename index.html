// --- АНАЛИЗ ТЕКСТА ---
function analyzeText(answers) {
    const categories = {
        work_money: ['работ', 'деньг', 'заработ', 'карьер', 'офис'],
        anxiety: ['тревог', 'пережив', 'страх', 'боюсь', 'паник'],
        control: ['контрол', 'порядок', 'план', 'идеальн', 'должн', 'обязан'],
        people: ['люд', 'общ', 'друз', 'семь', 'отношен', 'эмпат', 'мнен'],
        tiredness: ['устал', 'сил', 'выгор', 'измат', 'энерг', 'отдых'],
        self_criticism: ['самокрит', 'вина', 'стыд', 'ошибк', 'нелеп']
    };
    const counts = {};
    Object.keys(categories).forEach(key => counts[key] = 0);
    answers.forEach(text => {
        const lower = text.toLowerCase();
        Object.entries(categories).forEach(([cat, words]) => {
            if (words.some(w => lower.includes(w))) counts[cat]++;
        });
    });
    const names = {work_money: '💼 Работа и деньги', anxiety: '🌪 Тревога и страх', control: '⚙️ Контроль и долженствование', people: '🤝 Люди и отношения', tiredness: '🔋 Усталость и истощение', self_criticism: '🪞 Самокритика и вина'};
    return Object.entries(counts).filter(([_, c]) => c > 0).sort((a,b) => b[1]-a[1]).map(([k, c]) => ({name: names[k], count: c, percent: Math.round((c / answers.length) * 100)}));
}

// --- РАСШИРЕННЫЙ АНАЛИЗ КОГНИТИВНЫХ ИСКАЖЕНИЙ ---
function analyzeDefenses(q4Answers, q5Answers) {
    const all = [...q4Answers, ...q5Answers];
    if (all.length === 0) return [];
    const defenses = [];
    
    // Чтение мыслей (расширенный список)
    const mindReading = all.filter(t => /(подумают|думают обо мне|мнение|считают|кажется, что я|осужд|оцен|переживаю о том, что|боюсь показаться)/i.test(t));
    if (mindReading.length) defenses.push({ title: 'Чтение мыслей', count: mindReading.length, desc: 'Убеждение: «Я точно знаю, что обо мне думают другие». Высокая чувствительность к чужому мнению.', examples: mindReading.slice(0, 2) });

    // Обесценивание (расширенный список)
    const deval = all.filter(t => /(ничего не получаю|не получаю|все равно|неважно|недостаточно|плохо|неидеальн|обесцен|не умею|не справляюсь|зря)/i.test(t));
    if (deval.length) defenses.push({ title: 'Обесценивание', count: deval.length, desc: 'Убеждение: «Я недостаточно хорош(а)». Склонность обесценивать свои достижения.', examples: deval.slice(0, 2) });

    // Гиперответственность (расширенный список)
    const hyper = all.filter(t => /(ответственн|отвечать|за все|должен|должна|обязан|обязана|надо)/i.test(t));
    if (hyper.length) defenses.push({ title: 'Гиперответственность', count: hyper.length, desc: 'Убеждение: «Я отвечаю за всё, что происходит вокруг». Склонность брать на себя лишнюю нагрузку.', examples: hyper.slice(0, 2) });

    // Катастрофизация
    const cat = all.filter(t => /(катастроф|ужас|кошмар|пропало|конец|все плохо)/i.test(t));
    if (cat.length) defenses.push({ title: 'Катастрофизация', count: cat.length, desc: 'Убеждение: «Если что-то пойдёт не так, случится непоправимое».', examples: cat.slice(0, 2) });

    return defenses;
}

function drawChart(pc) {

    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: Object.values(P).map(p => p.l), datasets: [{ data: Object.values(pc), backgroundColor: Object.values(P).map(p => p.c), borderWidth: 2, borderColor: '#ffffff' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });
}

}

  }
  
  const q=Q[step];const ci=steps.indexOf(step);const prog=(ci+1)/steps.length*100;
  const qHTML=q.o?`<div class="space-y-3">${q.o.map((opt,i)=>`<label class="block p-4 rounded-xl border-2 cursor-pointer ${a[step]===i?'border-violet-500 bg-violet-50':'border-gray-200'}"><input type="radio" ${a[step]===i?'checked':''} onchange="a['${step}']=${i};render()" class="hidden"/><span>${opt}</span></label>`).join('')}</div>`:`<textarea oninput="a['${step}']=this.value; checkNextBtn()" placeholder="Напишите..." class="w-full p-4 border-2 rounded-xl h-32">${a[step]}</textarea>`;
  const can=q.o?a[step]!==null:a[step].trim().length>0;
  
  app.innerHTML=`<div class="min-h-screen p-4"><div class="max-w-2xl mx-auto py-8"><div class="mb-6"><div class="flex justify-between text-sm mb-2"><span>Вопрос ${ci+1} из 6</span><span>${Math.round(prog)}%</span></div><div class="h-2 bg-gray-200 rounded-full"><div class="h-full bg-violet-500 rounded-full" style="width:${prog}%"></div></div></div><div class="bg-white rounded-xl shadow-xl p-6"><div class="text-xs text-violet-500 uppercase mb-2">${q.s}</div><h2 class="text-xl font-semibold mb-6">${q.t}</h2>${q.p?`<p class="text-gray-500 text-sm mb-4">${q.p}</p>`:''}${qHTML}</div><div class="flex justify-between mt-6">${ci>0?`<button onclick="step=steps[${ci-1}];render()" class="px-5 py-2 text-gray-500 hover:text-gray-800">← Назад</button>`:'<div></div>'}<button id="next-btn" onclick="${ci<5?`step=steps[${ci+1}];render()`:'submit()'}" ${!can?'disabled':''} class="px-6 py-2 rounded-xl font-semibold transition-colors ${can?'bg-violet-600 text-white hover:bg-violet-700':'bg-gray-200 text-gray-400 cursor-not-allowed'}">${ci<5?'Далее →':'Результат ✨'}</button></div></div></div>`;
}

function checkNextBtn() {
    const txtArea = document.querySelector('textarea');
    const nextBtn = document.getElementById('next-btn');
    if (txtArea && nextBtn) {
        const hasText = txtArea.value.trim().length > 0;
        nextBtn.disabled = !hasText;
        nextBtn.className = hasText ? 'px-6 py-2 rounded-xl font-semibold bg-violet-600 text-white hover:bg-violet-700 transition-colors' : 'px-6 py-2 rounded-xl font-semibold bg-gray-200 text-gray-400 cursor-not-allowed';
    }
}

async function submit(){
    const btn = document.getElementById('next-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = '⌛ Сохранение...';
        btn.className = 'px-6 py-2 rounded-xl font-semibold bg-gray-400 text-white cursor-wait';
    }

    prof=calc();
    try {
        const { error } = await supabase.from('submissions').insert({
            q1: a.q1, q2: a.q2, q3: a.q3, q4: a.q4, q5: a.q5, q6: a.q6, profile: prof
        });
        if (error) throw error;
        saved = true;
    } catch(e) {
        console.error('Ошибка сохранения:', e);
        alert('Не удалось сохранить ответ. Проверьте настройки доступа в Supabase.');
    }
    step='results';
    render();
}

async function load(){
    const textEl = document.getElementById('refresh-text');
    if (textEl) textEl.innerText = '⌛ Загрузка...';
    try {
        const { data, error } = await supabase.from('submissions').select('*').order('created_at', {ascending:false});
        if (error) throw error;
        const uniqueSubs = [];
        const seen = new Set();
        (data || []).forEach(sub => {
            const timeKey = new Date(sub.created_at).toISOString().slice(0, 19);
            const key = `${sub.q1}_${sub.q2}_${sub.q3}_${sub.q4}_${sub.q5}_${sub.q6}_${timeKey}`;
            if (!seen.has(key)) {
                seen.add(key);
                uniqueSubs.push(sub);
            }
        });
        subs = uniqueSubs;
    } catch(e) {
        console.error('Ошибка загрузки:', e);
        alert('Ошибка доступа к базе.');
    } finally {
        if (textEl) textEl.innerText = '🔄 Обновить данные';
        render(); 
    }
}

window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
