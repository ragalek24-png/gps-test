function analyzeBeliefs(q4, q5) {

  const fear = all.filter(t => /(страх|боюсь|тревог|опасн|неуверен)/i.test(t)); if (fear.length) beliefs.push({ title: 'Установка «Мир опасен»', count: fear.length, desc: 'Ожидание угрозы.', examples: fear.slice(0, 2), tip: 'Техника «Что худшее случится?» Оцените вероятность от 0 до 100. Чаще всего страх сильно преувеличен.' });
  const perfection = all.filter(t => /(идеальн|безошиб|всегда|продуктивн|лучше всех)/i.test(t)); if (perfection.length) beliefs.push({ title: 'Установка «Быть идеальным»', count: perfection.length, desc: 'Ценность = безошибочность.', examples: perfection.slice(0, 2), tip: 'Практика «Достаточно хороший результат». Разрешите себе сделать на 80% и сдать работу.' });
  const shame = all.filter(t => /(стыд|позор|вина|унижен|провал)/i.test(t)); if (shame.length) beliefs.push({ title: 'Установка «Ошибка = Позор»', count: shame.length, desc: 'Публичная ошибка = потеря лица.', examples: shame.slice(0, 2), tip: 'Разделите ошибку и личность. «Я совершил ошибку» ≠ «Я плохой человек». Ошибка — это действие, а не приговор.' });
  const control = all.filter(t => /(контрол|порядок|план|распоряд)/i.test(t)); if (control.length) beliefs.push({ title: 'Установка «Всё под контролем»', count: control.length, desc: 'Потребность контролировать всё.', examples: control.slice(0, 2), tip: 'Упражнение «Круг контроля». Нарисуйте круг: внутри — что вы можете контролировать, снаружи — что не можете. Фокусируйтесь только на внутреннем.' });
  const deval = all.filter(t => /(ничего не получаю|не получаю|все равно|недостаточно|плохо|зря)/i.test(t)); if (deval.length) beliefs.push({ title: 'Установка «Я недостаточно хорош»', count: deval.length, desc: 'Обесценивание достижений.', examples: deval.slice(0, 2), tip: 'Ведите «Дневник побед». Каждый вечер записывайте 3 вещи, которые у вас получились сегодня, даже маленькие.' });
  const approval = all.filter(t => /(подумают|мнение|считают|осужд|понрав|оцен)/i.test(t)); if (approval.length) beliefs.push({ title: 'Установка «Нужно одобрение»', count: approval.length, desc: 'Зависимость от чужого мнения.', examples: approval.slice(0, 2), tip: 'Спросите себя: «Что я потеряю, если этот человек будет думать обо мне плохо?» Часто ответ — ничего.' });

  return beliefs;

function analyzeDefenses(q4, q5) {
  const all = [...q4, ...q5].filter(t => t && t.trim() !== '');
  const defs = [];
  const rat = all.filter(t => /(потому что|так как|ведь|устойчивость|добродетель)/i.test(t) && t.length > 20); if (rat.length) defs.push({ title: 'Рационализация', count: rat.length, desc: 'Попытка объяснить проблему «логичными» причинами. Переупаковка дефицита в добродетель.', examples: rat.slice(0, 2) });
  const proj = all.filter(t => /(люди считают|из-за них|они думают|обвиня|все вокруг)/i.test(t)); if (proj.length) defs.push({ title: 'Проекция', count: proj.length, desc: 'Перенос собственных чувств или ответственности на других.', examples: proj.slice(0, 2) });
  const deny = all.filter(t => /(все хорошо|ничего страшного|все нормально|а так ок)/i.test(t)); if (deny.length) defs.push({ title: 'Отрицание', count: deny.length, desc: 'Игнорирование реальности или противоречия в собственных словах.', examples: deny.slice(0, 2) });
  const intel = all.filter(t => t.split(' ').length > 15); if (intel.length) defs.push({ title: 'Интеллектуализация', count: intel.length, desc: 'Уход в абстракции и философствование вместо личного переживания.', examples: intel.slice(0, 2) });
  const reaction = all.filter(t => /(я свободна|я спокоен|все отлично)/i.test(t) && /(не могу|страдаю|устал)/i.test(t)); if (reaction.length) defs.push({ title: 'Реактивное образование', count: reaction.length, desc: 'Декларация противоположного истинному чувству.', examples: reaction.slice(0, 2) });
  const deval = all.filter(t => /(ничего не получаю|зря|все равно)/i.test(t)); if (deval.length) defs.push({ title: 'Обесценивание', count: deval.length, desc: 'Обнуление своих ресурсов и достижений.', examples: deval.slice(0, 2) });
  const repress = all.filter(t => /(не думаю|не хочу думать|забыл|не помню)/i.test(t)); if (repress.length) defs.push({ title: 'Вытеснение', count: repress.length, desc: 'Удаление из сознания неприятных мыслей, но их следы остаются.', examples: repress.slice(0, 2) });
  const subst = all.filter(t => /(работ|уборк|домашн)/i.test(t) && /(злюсь|бесит|раздража|ненавижу)/i.test(t)); if (subst.length) defs.push({ title: 'Замещение', count: subst.length, desc: 'Перенос эмоций с опасного объекта на безопасный.', examples: subst.slice(0, 2) });
  const somat = all.filter(t => /(устал|нет сил|выносл|энерг|забирает)/i.test(t)); if (somat.length) defs.push({ title: 'Соматизация', count: somat.length, desc: 'Перевод психологического стресса в телесные симптомы.', examples: somat.slice(0, 2) });
  return defs;
}

function analyzeText(answers) {
  const cats = {work:['работ','деньг','заработ','карьер'],anx:['тревог','пережив','страх','боюсь'],ctrl:['контрол','порядок','план','должн'],ppl:['люд','общ','друз','семь'],tired:['устал','сил','выгор','измат'],crit:['самокрит','вина','стыд','ошибк']};
  const counts={}; Object.keys(cats).forEach(k=>counts[k]=0);
  answers.forEach(t=>{const l=t.toLowerCase();Object.entries(cats).forEach(([k,w])=>{if(w.some(x=>l.includes(x)))counts[k]++;});});
  const names={work:'💼 Работа',anx:'🌪 Тревога',ctrl:'⚙️ Контроль',ppl:'🤝 Люди',tired:'🔋 Усталость',crit:'🪞 Самокритика'};
  return Object.entries(counts).filter(([_,c])=>c>0).sort((a,b)=>b[1]-a[1]).map(([k,c])=>({name:names[k],count:c,percent:Math.round(c/answers.length*100)}));
}
