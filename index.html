<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: Ваш внутренний GPS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-violet-50 min-h-screen">
<div id="app"></div>
<script>
const { createClient } = window.supabase;
const supabase = createClient('https://vurnrdqxbzqijwkcywsf.supabase.co', 'sb_publishable_nsz3vSuJz1JumMT3IVoRMg_vMLEe4n2');

const Q = {
  q1: {s:'Секция 1',t:'Вы написали важное сообщение другу. Он прочитал, но не отвечает полдня. Первая мысль:',o:['Наверное, закрутился','Я написал что-то не то','Людям плевать на меня','Это катастрофа']},
  q2: {s:'Секция 1',t:'Вы случайно отправили не тот файл в чат. Исправили, но внутри:',o:['Бывает, поехали дальше','Какой я нелепый','Все думают что я непрофессионал','Нужно проверять всё десять раз']},
  q3: {s:'Секция 2',t:'Ваш внутренний голос после тяжёлого дня чаще всего говорит:',o:['Давай отдохнём, ты молодец','Мог бы и лучше, соберись','Почему ты всё усложняешь?','Завтра будет ещё хуже']},
  q4: {s:'Секция 3',t:'Закончите фразу:',p:'«Я бы чувствовал(а) себя свободно, если бы не нужно было постоянно...»'},
  q5: {s:'Секция 3',t:'Закончите фразу:',p:'«Моя суперсила — это [...], но она же меня и изматывает, потому что...»'},
  q6: {s:'Секция 4',t:'Вам предлагают сложную задачу с риском облажаться. Ваш отклик:',o:['Интересно, попробую','А вдруг я самозванец?','Если не идеально — нет смысла','Лучше откажусь, нет сил']}
};

const P={
  balanced:{l:'Устойчивый',d:'GPS на здоровой волне',tip:'Гибкость — суперсила',c:'#10b981'},
  mild:{l:'Наблюдатель',d:'GPS делает крюки',tip:'Адвокат дьявола: доказательства ПРОТИВ мысли?',c:'#6366f1'},
  moderate:{l:'Радар',d:'Мозг усиливает сигналы',tip:'Дневник мыслей',c:'#f59e0b'},
  intense:{l:'Исследователь',d:'Мир насыщен',tip:'Психолог (КПТ) даст инструменты',c:'#a855f7'}
};

let step='intro',a={q1:null,q2:null,q3:null,q4:'',q5:'',q6:null},prof='',saved=false,subs=[],view='overview';
const steps=['q1','q2','q3','q4','q5','q6'];

function calc(){let s=0;if(a.q1!==null)s+=a.q1;if(a.q2!==null)s+=a.q2;if(a.q3!==null)s+=a.q3;if(a.q6!==null)s+=a.q6;return s<=3?'balanced':s<=6?'mild':s<=9?'moderate':'intense';}

function render(){
  const app=document.getElementById('app');
  
  // --- АДМИНКА ---
  if(location.hash==='#admin'){
    if(!window.isAdmin){
        const pass = prompt("Введите пароль администратора:");
        if(pass === 'admin2024'){
            window.isAdmin = true;
            load();
        } else {
            alert("Неверный пароль");
            location.hash = '';
            return;
        }
    }

    const pc={balanced:0,mild:0,moderate:0,intense:0};
    subs.forEach(s=>{pc[s.profile]=(pc[s.profile]||0)+1;});
    const t=subs.length;
    
    // --- ОБЗОР (Группировка по вопросам) ---
    let overviewHTML = '';
    if (view === 'overview' && t > 0) {
        // Собираем все непустые ответы на Q4 и Q5
        const q4Answers = subs.map(s => s.q4).filter(text => text && text.trim() !== '');
        const q5Answers = subs.map(s => s.q5).filter(text => text && text.trim() !== '');

        overviewHTML = `
        <div class="bg-white rounded-xl p-6 mb-4">
            <h3 class="font-semibold mb-4 text-lg">Статистика профилей</h3>
            ${Object.entries(P).map(([k,v])=>{
                const c = pc[k] || 0;
                const p = t > 0 ? (c/t)*100 : 0;
                return `<div class="flex items-center gap-3 mb-3">
                    <span class="w-32 text-sm font-medium">${v.l}</span>
                    <div class="flex-1 h-6 bg-gray-100 rounded">
                        <div class="h-full rounded text-white text-xs flex items-center justify-end pr-2" style="width:${Math.max(p,2)}%;background-color:${v.c}">${c}</div>
                    </div>
                    <span class="text-sm w-12 text-right">${p.toFixed(0)}%</span>
                </div>`;
            }).join('')}
        </div>

        <div class="grid md:grid-cols-2 gap-4 mb-4">
            <!-- Блок Q4 -->
            <div class="bg-white rounded-xl p-6">
                <h3 class="font-semibold mb-2 text-lg text-violet-700">Ответы на Q4</h3>
                <p class="text-xs text-gray-500 mb-4">«Я бы чувствовал(а) себя свободно, если бы не нужно было постоянно...»</p>
                <ul class="space-y-2">
                    ${q4Answers.length > 0 
                        ? q4Answers.map(ans => `<li class="bg-violet-50 p-3 rounded-lg text-sm text-gray-800 border-l-4 border-violet-300">${ans}</li>`).join('')
                        : '<li class="text-gray-400 text-sm italic">Пока нет ответов</li>'}
                </ul>
            </div>

            <!-- Блок Q5 -->
            <div class="bg-white rounded-xl p-6">
                <h3 class="font-semibold mb-2 text-lg text-violet-700">Ответы на Q5</h3>
                <p class="text-xs text-gray-500 mb-4">«Моя суперсила — это [...], но она же меня и изматывает, потому что...»</p>
                <ul class="space-y-2">
                    ${q5Answers.length > 0 
                        ? q5Answers.map(ans => `<li class="bg-violet-50 p-3 rounded-lg text-sm text-gray-800 border-l-4 border-violet-300">${ans}</li>`).join('')
                        : '<li class="text-gray-400 text-sm italic">Пока нет ответов</li>'}
                </ul>
            </div>
        </div>
        `;
    }

    // --- СПИСОК (таблица по людям) ---
    let listHTML = '';
    if (view === 'list') {
        listHTML = `<div class="bg-white rounded-xl p-6 mb-4"><h3 class="font-semibold mb-4 text-lg">Все ответы (${t})</h3>`;
        if (t === 0) {
            listHTML += '<p>Пока нет ответов</p>';
        } else {
            listHTML += `<div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="border-b"><th class="p-2">#</th><th class="p-2">Дата</th><th class="p-2">Профиль</th><th class="p-2">Q4</th><th class="p-2">Q5</th></tr></thead><tbody>`;
            listHTML += subs.map((s,i)=>`<tr class="border-b">
                <td class="p-2">${t-i}</td>
                <td class="p-2 text-sm whitespace-nowrap">${new Date(s.created_at).toLocaleString('ru-RU')}</td>
                <td class="p-2"><span class="px-2 py-1 rounded text-xs text-white" style="background-color:${P[s.profile]?.c}">${P[s.profile]?.l}</span></td>
                <td class="p-2 text-sm">${s.q4 || '-'}</td>
                <td class="p-2 text-sm">${s.q5 || '-'}</td>
            </tr>`).join('');
            listHTML += `</tbody></table></div>`;
        }
        listHTML += `</div>`;
    }

    app.innerHTML = `<div class="min-h-screen bg-gray-50 p-4"><div class="max-w-6xl mx-auto">
        <div class="bg-white rounded-xl p-6 mb-6">
            <h1 class="text-2xl font-bold mb-4">Админ-панель</h1>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
                <div class="bg-gray-50 rounded-xl p-4 border"><div class="text-3xl font-bold">${t}</div><div class="text-sm text-gray-500">Всего ответов</div></div>
                ${Object.entries(P).map(([k,v])=>`<div class="bg-gray-50 rounded-xl p-4 border"><div class="text-3xl font-bold" style="color:${v.c}">${pc[k]}</div><div class="text-sm">${v.l}</div></div>`).join('')}
            </div>
            <button onclick="load()" class="px-4 py-2 bg-violet-600 text-white rounded-lg font-medium">Обновить данные</button>
        </div>
        
        ${view === 'overview' ? overviewHTML : listHTML}
        
        <div class="flex gap-2">
            <button onclick="view='overview';render()" class="px-4 py-2 rounded-lg font-medium ${view==='overview'?'bg-violet-600 text-white':'bg-white border text-gray-700'}">Обзор</button>
            <button onclick="view='list';render()" class="px-4 py-2 rounded-lg font-medium ${view==='list'?'bg-violet-600 text-white':'bg-white border text-gray-700'}">Список ответов</button>
        </div>
    </div></div>`;
    return;
  }

  // --- ТЕСТ ---
  if(step==='intro'){
    app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="text-center"><div class="text-6xl mb-6">🧭</div><h1 class="text-3xl font-bold mb-4">Ваш внутренний GPS<br/>в стрессовых ситуациях</h1><p class="text-lg text-gray-600 mb-6 max-w-lg">Пара быстрых вопросов о том, как ваш мозг реагирует на мелочи. 1 минута, анонимно.</p><button onclick="step='q1';render()" class="px-8 py-4 bg-violet-600 text-white rounded-xl text-lg">Начать тест →</button></div></div>`;
    return;
  }
  
  if(step==='results'){
    const info=P[prof];
    app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl p-8 max-w-lg w-full">
            ${saved?'<div class="text-green-600 mb-4 text-center font-medium">✓ Ответы сохранены</div>':''}
            <div class="text-center mb-6">
                <h2 class="text-3xl font-bold mb-2">${info.l}</h2>
                <p class="text-gray-600">${info.d}</p>
            </div>
            <div class="bg-violet-50 rounded-xl p-5 mb-6 text-gray-700">
                <h3 class="font-semibold mb-2 text-violet-700">Рекомендация:</h3>
                <p>${info.tip}</p>
            </div>
            <div class="text-center">
                <button onclick="a={q1:null,q2:null,q3:null,q4:'',q5:'',q6:null};saved=false;step='intro';render()" class="text-violet-600 font-medium hover:underline">Пройти заново</button>
            </div>
        </div>
    </div>`;
    return;
  }
  
  const q=Q[step];const ci=steps.indexOf(step);const prog=(ci+1)/steps.length*100;
  const qHTML=q.o?`<div class="space-y-3">${q.o.map((opt,i)=>`<label class="block p-4 rounded-xl border-2 cursor-pointer ${a[step]===i?'border-violet-500 bg-violet-50':'border-gray-200'}"><input type="radio" ${a[step]===i?'checked':''} onchange="a['${step}']=${i};render()" class="hidden"/><span>${opt}</span></label>`).join('')}</div>`:`<textarea oninput="a['${step}']=this.value; checkNextBtn()" placeholder="Напишите..." class="w-full p-4 border-2 rounded-xl h-32">${a[step]}</textarea>`;
  
  const can=q.o?a[step]!==null:a[step].trim().length>0;
  
  app.innerHTML=`<div class="min-h-screen p-4"><div class="max-w-2xl mx-auto py-8"><div class="mb-6"><div class="flex justify-between text-sm mb-2"><span>Вопрос ${ci+1} из 6</span><span>${Math.round(prog)}%</span></div><div class="h-2 bg-gray-200 rounded-full"><div class="h-full bg-violet-500 rounded-full" style="width:${prog}%"></div></div></div><div class="bg-white rounded-xl shadow-xl p-6"><div class="text-xs text-violet-500 uppercase mb-2">${q.s}</div><h2 class="text-xl font-semibold mb-6">${q.t}</h2>${q.p?`<p class="text-gray-500 text-sm mb-4">${q.p}</p>`:''}${qHTML}</div><div class="flex justify-between mt-6">${ci>0?`<button onclick="step=steps[${ci-1}];render()" class="px-5 py-2 text-gray-500">← Назад</button>`:'<div></div>'}<button id="next-btn" onclick="${ci<5?`step=steps[${ci+1}];render()`:'submit()'}" ${!can?'disabled':''} class="px-6 py-2 rounded-xl font-semibold ${can?'bg-violet-600 text-white':'bg-gray-200 text-gray-400'}">${ci<5?'Далее →':'Результат ✨'}</button></div></div></div>`;
}

function checkNextBtn() {
    const txtArea = document.querySelector('textarea');
    const nextBtn = document.getElementById('next-btn');
    if (txtArea && nextBtn) {
        const hasText = txtArea.value.trim().length > 0;
        nextBtn.disabled = !hasText;
        if (hasText) {
            nextBtn.className = 'px-6 py-2 rounded-xl font-semibold bg-violet-600 text-white';
        } else {
            nextBtn.className = 'px-6 py-2 rounded-xl font-semibold bg-gray-200 text-gray-400';
        }
    }
}

async function submit(){
    prof=calc();
    try {
        const { error } = await supabase.from('submissions').insert({
            q1: a.q1, q2: a.q2, q3: a.q3, q4: a.q4, q5: a.q5, q6: a.q6, profile: prof
        });
        if (error) throw error;
        saved = true;
    } catch(e) {
        console.error('Ошибка сохранения:', e);
        alert('Не удалось сохранить ответ. Проверьте настройки доступа в Supabase.');
    }
    step='results';
    render();
}

async function load(){
    const { data, error } = await supabase.from('submissions').select('*').order('created_at', {ascending:false});
    if (error) {
        console.error('Ошибка загрузки:', error);
        alert('Ошибка доступа к базе. Проверьте политики (Policies) в Supabase.');
    } else {
        subs = data || [];
    }
    render();
}

window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
